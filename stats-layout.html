<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>家庭账本统计</title><style>body{margin:0;background:#f7f5ef;color:#2d332e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 40px}.card,.box{background:#fffdfa;border-radius:20px;box-shadow:0 8px 24px rgba(50,60,53,.07)}.card{padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:14px}.muted{color:#7b817c;font-size:12px}.big{font-size:24px;font-weight:800;margin-top:4px}.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.sel div{background:#efede7;border-radius:14px;padding:12px;font-weight:700}.title{font-size:14px;color:#7b817c;font-weight:700;margin:20px 2px 8px}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8e5dc}.bar{height:9px;background:#ece9e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5f8068}.tag{display:inline-block;background:#dfeadf;padding:3px 7px;border-radius:99px;font-size:11px;margin-right:4px}.blue{background:#e7eef7}.row{padding:11px 0;border-bottom:1px solid #e8e5dc}</style></head><body><div class='app'><h1>家庭账本统计</h1><div class='muted'>按年份和月份查看上传、消费与分类</div><div class='sel'><div>2026年 ▾</div><div>8月 ▾</div></div><div class='grid'><div class='box'><div class='muted'>本月总支出</div><div class='big'>¥906</div></div><div class='box'><div class='muted'>本月记录</div><div class='big'>6笔</div></div></div><div class='title'>谁上传 / 记录了多少</div><div class='card'><div class='line'><b>老公</b><span>¥365 · 2笔</span></div><div class='bar'><i style='width:40%'></i></div><div class='line'><b>老婆</b><span>¥541 · 4笔</span></div><div class='bar'><i style='width:60%'></i></div></div><div class='title'>谁消费了多少</div><div class='card'><div class='line'><b>老公消费</b><span>¥45</span></div><div class='line'><b>老婆消费</b><span>¥326</span></div><div class='line'><b>家庭共同</b><span>¥535</span></div></div><div class='title'>消费分类</div><div class='card'><div class='line'><b>交通</b><span>¥320</span></div><div class='bar'><i style='width:35%'></i></div><div class='line'><b>购物</b><span>¥268</span></div><div class='bar'><i style='width:30%'></i></div><div class='line'><b>孩子</b><span>¥129</span></div><div class='bar'><i style='width:14%'></i></div><div class='line'><b>买菜</b><span>¥86</span></div><div class='bar'><i style='width:10%'></i></div><div class='line'><b>餐饮</b><span>¥103</span></div><div class='bar'><i style='width:11%'></i></div></div><div class='title'>账单明细</div><div class='card'><div class='row'><b>买菜 · 永辉超市</b><div class='muted'><span class='tag'>消费者：家庭共同</span><span class='tag blue'>老婆 · 微信导入</span></div><b>¥86</b></div><div class='row'><b>购物 · 淘宝</b><div class='muted'><span class='tag'>消费者：老婆</span><span class='tag blue'>老婆 · 支付宝导入</span></div><b>¥268</b></div><div class='row'><b>交通 · 加油</b><div class='muted'><span class='tag'>消费者：家庭共同</span><span class='tag blue'>老公 · 手工记录</span></div><b>¥320</b></div></div></div></body></html>
