<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf3ec"><title>家庭账本</title><link rel="stylesheet" href="app-v2.css"></head><body><div class="app"><section id="ledger"><h1>家庭账本</h1><div class="sub" id="sub">家庭共用的一本账</div><div class="identity"><b id="whoText">当前操作人：老公</b><button onclick="toggleOperator()">切换</button></div><div class="grid"><div class="stat"><span>本月已花</span><b id="m">¥0</b></div><div class="stat"><span>今日支出</span><b id="t">¥0</b></div><div class="stat"><span>本月预算</span><b id="b">¥6000</b></div><div class="stat"><span>剩余预算</span><b id="l">¥6000</b></div></div><div class="card"><div class="amt"><span>¥</span><input id="a" inputmode="decimal" placeholder="0"></div><div class="cats" id="cats"></div><div class="label">消费归属</div><div class="seg six" id="consumer"><button data-v="老公">老公</button><button data-v="老婆">老婆</button><button data-v="安安">安安</button><button data-v="可可">可可</button><button data-v="家庭共同" class="on">家庭共同</button><button data-v="公司开销">公司开销</button></div><input id="note" class="note" placeholder="备注（可不填）"><button id="add" class="primary">记一笔</button></div><div class="toolbar"><button class="secondary" onclick="go('import')">导入账单</button><button class="secondary" onclick="go('stats')">看统计</button></div><div class="title">最近记录</div><div id="recent"></div></section><section id="import" class="hidden"><h1>导入账单</h1><div class="sub">上传人自动记录为当前操作人</div><div class="identity"><b id="importWho">上传人：老公</b><button onclick="toggleOperator()">切换</button></div><div class="card"><div class="label">这批账单默认消费归属</div><div class="seg six" id="importConsumer"><button data-v="老公">老公</button><button data-v="老婆">老婆</button><button data-v="安安">安安</button><button data-v="可可">可可</button><button data-v="家庭共同" class="on">家庭共同</button><button data-v="公司开销">公司开销</button></div><div class="upload" style="margin-top:12px"><b>选择微信 / 支付宝 CSV 或 TXT 账单</b><input id="file" type="file" accept=".csv,.txt,text/csv"><div class="hint">自动尽量排除退款、充值、还款、失败交易和重复记录。</div></div><div id="preview"></div><button id="confirm" class="primary hidden">确认导入</button></div></section><section id="stats" class="hidden"><h1>家庭账本统计</h1><div class="sub">按年月查看谁记录、谁消费、钱花到哪里</div><div class="selectors"><select id="yearSel"></select><select id="monthSel"></select></div><div class="grid"><div class="stat"><span>总支出</span><b id="st">¥0</b></div><div class="stat"><span>记录笔数</span><b id="cnt">0笔</b></div></div><div class="title">谁上传 / 记录了多少</div><div id="opStats" class="card"></div><div class="title">谁消费了多少</div><div id="conStats" class="card"></div><div class="title">消费分类</div><div id="cs" class="card"></div><div class="title">账单明细</div><div id="detail"></div><div class="title">设置本月预算</div><div class="card"><input id="bi" class="note" inputmode="numeric"><button id="saveB" class="primary">保存预算</button></div></section></div><div class="nav"><div><button id="n-ledger" class="on" onclick="go('ledger')">记账</button><button id="n-import" onclick="go('import')">导入</button><button id="n-stats" onclick="go('stats')">统计</button></div></div><script src="app-v2.js"></script></body></html>
