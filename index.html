<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf3ec"><title>家庭账本</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#f7f5ef;--card:#fffdfa;--ink:#2d332e;--muted:#7b817c;--g:#5f8068;--g2:#dfeadf;--line:#e8e5dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 90px}.hidden{display:none}h1{margin:6px 0 2px;font-size:26px}.sub{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat,.card,.row{background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(50,60,53,.07)}.stat{padding:15px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:4px}.card{padding:15px;margin-top:14px}.amt{display:flex;align-items:end;border-bottom:1px solid var(--line)}.amt span{font-size:28px;color:var(--muted);padding:0 5px 8px 0}.amt input{width:100%;border:0;outline:0;background:transparent;font-size:52px;font-weight:800}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}.cat{border:0;border-radius:14px;padding:9px 2px;background:#efede7;font-size:12px}.cat.on{background:var(--g);color:white}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.seg button,.secondary{border:0;border-radius:14px;padding:11px;background:#efede7;font-weight:700;color:var(--muted)}.seg button.on{background:var(--g2);color:var(--ink)}.note{width:100%;border:0;outline:0;background:#efede7;border-radius:14px;padding:12px;margin-top:10px}.primary{width:100%;border:0;border-radius:15px;padding:14px;background:var(--g);color:white;font-weight:800;font-size:16px;margin-top:11px}.toolbar{display:flex;gap:8px;margin-top:12px}.toolbar .secondary{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink)}.title{font-size:14px;color:var(--muted);font-weight:700;margin:18px 2px 8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 12px;margin:7px 0}.meta{font-size:12px;color:var(--muted);margin-top:2px}.money{font-weight:800}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,250,.96);border-top:1px solid var(--line)}.nav div{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:10px;border-radius:13px;color:var(--muted);font-weight:700}.nav button.on{background:var(--g2);color:var(--ink)}.upload{border:1.5px dashed #b7c5ba;border-radius:16px;padding:16px;text-align:center}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.bar{height:9px;background:#ece9e1;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{height:100%;display:block;background:var(--g)}</style></head><body><div class="app"><section id="ledger"><h1>家庭账本</h1><div class="sub" id="sub">轻松记，月底自然看得清</div><div class="grid"><div class="stat"><span>本月已花</span><b id="m">¥0</b></div><div class="stat"><span>今日支出</span><b id="t">¥0</b></div><div class="stat"><span>本月预算</span><b id="b">¥6000</b></div><div class="stat"><span>剩余预算</span><b id="l">¥6000</b></div></div><div class="card"><div class="amt"><span>¥</span><input id="a" inputmode="decimal" placeholder="0"></div><div class="cats" id="cats"></div><div class="seg" id="payer"><button data-v="老婆" class="on">老婆</button><button data-v="我">我</button></div><div class="seg" id="need"><button data-v="必要" class="on">必要</button><button data-v="可选">可选</button></div><input id="note" class="note" placeholder="备注（可不填）"><button id="add" class="primary">记一笔</button></div><div class="toolbar"><button class="secondary" onclick="go('import')">导入账单</button><button class="secondary" onclick="go('stats')">看统计</button></div><div class="title">最近记录</div><div id="recent"></div></section><section id="import" class="hidden"><h1>导入账单</h1><div class="sub">微信 / 支付宝 CSV 批量导入</div><div class="card"><div class="upload"><b>选择导出的 CSV / TXT 账单</b><input id="file" type="file" accept=".csv,.txt,text/csv"><div class="hint">自动排除退款、转账、充值、还款和失败交易，并尽量分类与去重。</div></div><div id="preview"></div><button id="confirm" class="primary hidden">确认导入</button></div></section><section id="stats" class="hidden"><h1>本月统计</h1><div class="sub">钱主要花在哪里</div><div class="card"><b id="st" style="font-size:34px">¥0</b></div><div class="title">分类支出</div><div id="cs" class="card"></div><div class="title">设置预算</div><div class="card"><input id="bi" class="note" inputmode="numeric"><button id="saveB" class="primary">保存预算</button></div></section></div><div class="nav"><div><button id="n-ledger" class="on" onclick="go('ledger')">记账</button><button id="n-import" onclick="go('import')">导入</button><button id="n-stats" onclick="go('stats')">统计</button></div></div><script>const C=[["餐饮","🍜"],["买菜","🥬"],["孩子","🧸"],["购物","🛍️"],["交通","🚕"],["家庭","🏠"],["娱乐","🎬"],["医疗","💊"],["人情","🎁"],["其他","✨"]],$=x=>document.getElementById(x),K='family_expense_v4',BK='family_budget_v4';let cat='餐饮',payer='老婆',need='必要',pend=[];const dat=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},sav=d=>localStorage.setItem(K,JSON.stringify(d)),bud=()=>Number(localStorage.getItem(BK)||6000),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}),sum=r=>r.reduce((s,x)=>s+Number(x.amount||0),0),ym=d=>{d=new Date(d);return d.getFullYear()+'-'+d.getMonth()},esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function rc(){$('cats').innerHTML=C.map(x=>`<button class="cat ${x[0]==cat?'on':''}" onclick="cat='${x[0]}';rc()"><div style="font-size:20px">${x[1]}</div>${x[0]}</button>`).join('')}function seg(id,set){[...$(id).querySelectorAll('button')].forEach(b=>b.onclick=()=>{[...$(id).querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');set(b.dataset.v)})}seg('payer',v=>payer=v);seg('need',v=>need=v);function render(){let d=dat().sort((a,b)=>new Date(b.date)-new Date(a.date)),mk=ym(new Date()),mr=d.filter(x=>ym(x.date)==mk),mt=sum(mr),td=sum(d.filter(x=>new Date(x.date).toDateString()==new Date().toDateString()));$('m').textContent=money(mt);$('t').textContent=money(td);$('b').textContent=money(bud());$('l').textContent=money(bud()-mt);$('sub').textContent='本月已记 '+mr.length+' 笔';$('recent').innerHTML=d.slice(0,8).map(x=>`<div class="row"><div><b>${esc(x.category)}${x.note?' · '+esc(x.note):''}</b><div class="meta">${new Date(x.date).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(x.payer)} · ${esc(x.source||'手工')}</div></div><div class="money">${money(x.amount)}</div></div>`).join('')||'<div class="hint">还没有记录。</div>';stats()}$('add').onclick=()=>{let v=Number($('a').value);if(!(v>0))return alert('先输入金额');let d=dat();d.push({id:Date.now()+Math.random(),date:new Date().toISOString(),amount:v,category:cat,payer,need,note:$('note').value.trim(),source:'手工'});sav(d);$('a').value='';$('note').value='';render()};function go(p){['ledger','import','stats'].forEach(x=>{$(x).classList.toggle('hidden',x!=p);$('n-'+x).classList.toggle('on',x==p)});if(p=='stats')stats()}function stats(){let mr=dat().filter(x=>ym(x.date)==ym(new Date())),tot=sum(mr);$('st').textContent=money(tot);let g={};mr.forEach(x=>g[x.category]=(g[x.category]||0)+Number(x.amount));$('cs').innerHTML=Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${esc(c)}</b><span>${money(v)}</span></div><div class="bar"><i style="width:${tot?v/tot*100:0}%"></i></div></div>`).join('')||'<div class="hint">暂无数据</div>';$('bi').value=bud()}$('saveB').onclick=()=>{let v=Number($('bi').value);if(v>0){localStorage.setItem(BK,v);render();alert('预算已保存')}};function parseCSV(t){let R=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(ch=='"'){if(q&&n=='"'){c+='"';i++}else q=!q}else if(ch==','&&!q){r.push(c);c=''}else if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&n=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}return R}const norm=s=>String(s||'').replace(/\s+/g,'').replace(/[（）()：:]/g,'').toLowerCase();function cls(s){let R=[["餐饮",/餐|饭|咖啡|奶茶|外卖|麦当劳|肯德基/],["买菜",/超市|菜市场|生鲜|盒马|永辉|山姆|水果/],["孩子",/儿童|宝宝|母婴|奶粉|玩具|绘本|童装/],["购物",/淘宝|天猫|京东|拼多多|服饰|化妆品/],["交通",/滴滴|打车|地铁|公交|加油|停车|12306/],["家庭",/物业|水费|电费|燃气|家居|房租|话费/],["娱乐",/电影|影院|游戏|旅游|酒店/],["医疗",/医院|药房|药店|诊所|挂号/],["人情",/红包|礼金|婚礼/]];for(let [c,r] of R)if(r.test(s))return c;return'其他'}function find(h,ks){let a=h.map(norm);for(let k of ks){let n=norm(k),i=a.findIndex(x=>x==n||x.includes(n));if(i>=0)return i}return-1}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let text=new TextDecoder('utf-8').decode(await f.arrayBuffer()).replace(/^\uFEFF/,'');let R=parseCSV(text),hi=R.findIndex(r=>r.map(norm).join('|').includes('金额')&&r.map(norm).join('|').includes('时间'));if(hi<0){$('preview').innerHTML='<div class="hint">没有识别到账单表头。</div>';return}let h=R[hi],di=find(h,['交易时间','付款时间','时间']),ai=find(h,['金额(元)','金额','交易金额']),ii=find(h,['收支','收入/支出']),mi=find(h,['交易对方','商户名称','对方']),ni=find(h,['商品','商品名称','商品说明','交易说明']),si=find(h,['交易状态','状态']),oi=find(h,['交易单号','交易号','订单号']);let src=/支付宝|alipay/i.test(f.name)?'支付宝':/微信|wechat/i.test(f.name)?'微信':'账单',seen=new Set(dat().map(x=>x.fp).filter(Boolean));pend=[];for(let r of R.slice(hi+1)){let date=r[di]||'',am=parseFloat(String(r[ai]||'').replace(/[¥￥,\s]/g,'')),io=r[ii]||'',m=r[mi]||'',n=r[ni]||'',st=r[si]||'',ord=r[oi]||'',all=m+' '+n+' '+st+' '+io;if(!date||!(am>0))continue;if(/退款|充值|提现|还款|转账|关闭|失败|取消|收入|收款/.test(all))continue;if(io&&!/支出|付款|消费|支付/.test(io))continue;let fp=[src,ord,date,am,m,n].join('|');if(seen.has(fp))continue;seen.add(fp);let dt=new Date(date.replace(/\//g,'-'));if(isNaN(dt))dt=new Date();pend.push({id:Date.now()+Math.random(),date:dt.toISOString(),amount:am,category:cls(m+' '+n),payer:'老婆',need:'必要',note:(m+(n?' · '+n:'')).slice(0,100),source:src,fp})}$('preview').innerHTML=`<div class="card"><b>可导入 ${pend.length} 笔</b><div class="hint">已自动过滤非消费和重复记录</div></div>`;$('confirm').classList.toggle('hidden',!pend.length)};$('confirm').onclick=()=>{let d=dat();d.push(...pend);sav(d);alert('已导入 '+pend.length+' 笔');pend=[];$('file').value='';$('preview').innerHTML='';$('confirm').classList.add('hidden');render();go('ledger')};rc();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
