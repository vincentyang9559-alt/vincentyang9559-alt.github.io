<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家庭账本·身份版预览</title><style>:root{--bg:#f7f5ef;--card:#fffdfa;--ink:#2d332e;--muted:#7b817c;--g:#5f8068;--g2:#dfeadf;--line:#e8e5dc;--blue:#e7eef7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 40px}h1{margin:6px 0 2px;font-size:26px}.sub,.meta{font-size:12px;color:var(--muted)}.card,.row{background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(50,60,53,.07)}.card{padding:15px;margin-top:14px}.label{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 7px}.seg{display:grid;gap:8px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}button{border:0;border-radius:14px;padding:12px 7px;background:#efede7;font-weight:700;color:var(--muted)}button.on{background:var(--g2);color:var(--ink)}.amount{font-size:48px;font-weight:800;border:0;outline:0;background:transparent;width:100%;border-bottom:1px solid var(--line)}.primary{width:100%;margin-top:14px;background:var(--g);color:white;font-size:16px}.title{font-size:14px;color:var(--muted);font-weight:700;margin:20px 2px 8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;margin:8px 0}.money{font-weight:800}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:var(--g2);margin:4px 4px 0 0;font-size:11px}.tag.source{background:var(--blue)}.filter{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.filter button{white-space:nowrap;padding:8px 11px;font-size:12px}.notice{padding:11px 12px;border-radius:15px;background:#eef5ee;margin-top:12px;font-size:12px;line-height:1.6}</style></head><body><div class="app"><h1>家庭账本</h1><div class="sub">身份区分版 · 先看交互效果</div><div class="notice">当前页面只演示“谁记录/上传”和“消费者”怎么区分。云端同步下一步接数据库后启用。</div><div class="card"><div class="label">这台手机是谁在用？（只需设置一次）</div><div class="seg two" id="operator"><button class="on" data-v="老公">老公</button><button data-v="老婆">老婆</button></div><div class="label">金额</div><input id="amount" class="amount" inputmode="decimal" placeholder="¥ 0"><div class="label">消费者</div><div class="seg three" id="consumer"><button data-v="老公">老公</button><button data-v="老婆">老婆</button><button class="on" data-v="家庭共同">家庭共同</button></div><div class="label">来源</div><div class="seg three" id="source"><button class="on" data-v="手工记录">手工</button><button data-v="微信导入">微信</button><button data-v="支付宝导入">支付宝</button></div><button class="primary" id="add">加入预览账单</button></div><div class="title">账单筛选</div><div class="filter" id="filters"><button class="on" data-v="全部">全部</button><button data-v="老公">老公消费</button><button data-v="老婆">老婆消费</button><button data-v="家庭共同">家庭共同</button></div><div class="title">最近记录</div><div id="list"></div></div><script>const $=x=>document.getElementById(x);let operator='老公',consumer='家庭共同',source='手工记录',filter='全部';let rows=[{amount:86,operator:'老婆',consumer:'家庭共同',source:'微信导入',note:'买菜 · 永辉超市'},{amount:268,operator:'老婆',consumer:'老婆',source:'支付宝导入',note:'购物 · 淘宝'},{amount:320,operator:'老公',consumer:'家庭共同',source:'手工记录',note:'交通 · 加油'},{amount:45,operator:'老公',consumer:'老公',source:'微信导入',note:'餐饮 · 午餐'}];function bind(id,set){[...$(id).querySelectorAll('button')].forEach(b=>b.onclick=()=>{[...$(id).querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');set(b.dataset.v)})}bind('operator',v=>operator=v);bind('consumer',v=>consumer=v);bind('source',v=>source=v);bind('filters',v=>{filter=v;render()});function render(){let d=filter==='全部'?rows:rows.filter(x=>x.consumer===filter);$('list').innerHTML=d.map(x=>`<div class="row"><div><b>${x.note}</b><div><span class="tag">消费者：${x.consumer}</span><span class="tag source">${x.operator} · ${x.source}</span></div><div class="meta">这里把“谁操作”和“谁消费”分开保存</div></div><div class="money">¥${x.amount}</div></div>`).join('')||'<div class="sub">没有记录</div>'}$('add').onclick=()=>{let a=Number($('amount').value);if(!(a>0))return alert('先输入金额');rows.unshift({amount:a,operator,consumer,source,note:'示例消费'});$('amount').value='';render()};render();</script></body></html>
